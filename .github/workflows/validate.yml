name: Validate

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Validate package
        run: python scripts/validate_repository.py
      - name: Run tests
        run: python -m unittest discover -s tests -v
      - name: Test AskNam state and routing
        run: python skills/asknam/scripts/test_state_tools.py
      - name: Verify install-portable resources
        run: python skills/asknam/scripts/validate_resources.py --require-mirrors
      - name: Compile helper scripts
        run: python -m compileall -q scripts skills
