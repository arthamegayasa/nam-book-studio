name: Validate

on:
  push:
    branches: [main]
    paths-ignore:
      - "docs/**"
      - ".scratch/**"
      - "*.md"
      - "LICENSE"
  pull_request:
    paths-ignore:
      - "docs/**"
      - ".scratch/**"
      - "*.md"
      - "LICENSE"

# One run per ref: a new push to the same PR or to main cancels the run it supersedes.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  validate:
    # Draft pull requests are gated locally; CI runs once they are marked ready.
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.13"
      - name: Install Pandoc for the render tests
        run: sudo apt-get update -qq && sudo apt-get install -y -qq --no-install-recommends pandoc && pandoc --version | head -1
      - name: Run every repository gate
        run: python scripts/run_checks.py
