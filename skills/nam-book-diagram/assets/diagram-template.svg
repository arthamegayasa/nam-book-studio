<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg"
     viewBox="0 0 1200 675"
     role="img"
     aria-labelledby="diagram-title diagram-description">
  <title id="diagram-title">Three-stage teaching process template</title>
  <desc id="diagram-description">A left-to-right example showing an input connected to a process and then to an outcome. Replace every example label and accessibility description for the actual figure.</desc>
  <style>
    /* Token sources: design_spec.typography.labels (label font family and weight),
       design_spec.color (paper, ink, muted, accent, tint) and
       illustration_setup.visual_tokens.palette (role overrides: ink, paper, accent,
       muted, neutral, process, outcome). The values below are neutral fallbacks;
       run scripts/apply_tokens.py to write the project's tokens into this block. */
    .canvas { fill: #ffffff; }
    .node { stroke: #333333; stroke-width: 3; }
    .input { fill: #eeeeee; }
    .process { fill: #d9d9d9; }
    .outcome { fill: #bfbfbf; }
    .edge { fill: none; stroke: #666666; stroke-width: 4; marker-end: url(#arrowhead); }
    .arrowhead { fill: #666666; }
    .label { fill: #333333; font-family: sans-serif; font-size: 28px; font-weight: 600; text-anchor: middle; }
  </style>
  <defs>
    <marker id="arrowhead" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path id="arrowhead-path" class="arrowhead" d="M 0 0 L 10 5 L 0 10 z"/>
    </marker>
  </defs>
  <rect id="background" class="canvas" x="0" y="0" width="1200" height="675"/>
  <g id="connectors">
    <path id="edge-input-process" class="edge" d="M 350 338 H 500"/>
    <path id="edge-process-outcome" class="edge" d="M 700 338 H 850"/>
  </g>
  <g id="nodes">
    <g id="node-input">
      <rect class="node input" x="100" y="258" width="250" height="160" rx="24"/>
      <text id="label-input" class="label" x="225" y="348">Input</text>
    </g>
    <g id="node-process">
      <rect class="node process" x="500" y="258" width="200" height="160" rx="24"/>
      <text id="label-process" class="label" x="600" y="348">Process</text>
    </g>
    <g id="node-outcome">
      <rect class="node outcome" x="850" y="258" width="250" height="160" rx="24"/>
      <text id="label-outcome" class="label" x="975" y="348">Outcome</text>
    </g>
  </g>
</svg>
